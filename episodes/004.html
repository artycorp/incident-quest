  "outro": {
    "ru": "Началось всё с ёмкости. На выходных основную базу перевели с m4.10xlarge на r3.2xlarge и заодно заменили PgBouncer на каждом хосте одним общим, ни то ни другое не проверив под нагрузкой. В выходные и вечером по Мельбурну база справлялась, а в понедельник, когда проснулись клиенты в США, CPU с 14:00 бился в потолок ([CPU](chart:dbcpu)), и около 16:00 база перестала успевать.\n\nДальше сработали два усилителя. Health check ходил в базу, и как только та начала тормозить, ELB дашборда выкинул все серверы разом ([серверы](chart:churn), [health checks](chart:hc)). Замена стартовала из AMI и спрашивала ревизию у самого buildkite.com, который лежал, поэтому оставалась на старом коде с проверкой выведенного шарда и не проходила health check никогда. Серверы часами запускались и умирали, пока не выбили лимит запросов к EC2. Сайт вернули в 22:28 серверами из Agent API, а в 23:10 — апгрейдом базы, новой AMI и возвратом PgBouncer на каждый хост ([Pingdom](chart:pingdom)). Виноват ли был общий PgBouncer, команда так и не выяснила: прежнюю схему вернули, потому что она уже доказала, что работает.\n\nДля нагрузочника: после любой смены инстанса базы или схемы пула соединений гоняйте нагрузочный тест на реальном профиле пика, а не смотрите на графики в тихие часы. Проверяйте, что происходит со всем пулом серверов, когда зависимость тормозит: если health check зависит от базы, медленная база выключает весь ELB сразу. И проверьте холодный старт сервера, когда сайт лежит, — именно тогда он нужнее всего.",
    "en": "It started with capacity. Over the weekend the main database moved from an m4.10xlarge to an r3.2xlarge, and the per-host PgBouncers were replaced with one shared PgBouncer, neither tested under load. On the weekend and through the Melbourne evening the database coped, but on Monday, once US customers woke up, CPU kept hitting the ceiling from 14:00 ([CPU](chart:dbcpu)), and around 16:00 the database fell behind.\n\nThen two amplifiers kicked in. The health check queried the database, so as soon as it slowed down, the dashboard ELB dropped every server at once ([servers](chart:churn), [health checks](chart:hc)). Replacements booted from an AMI and asked buildkite.com itself for the revision. The site was down, so they stayed on old code whose health check queried a decommissioned shard, and never passed. Servers launched and died for hours until they hit the EC2 request limit. The site came back at 22:28 on servers borrowed from the Agent API, and fully at 23:10 after a database upgrade, a new AMI and a return to PgBouncer on every host ([Pingdom](chart:pingdom)). Whether the shared PgBouncer was to blame the team never found out: they reverted to the old setup because it had already proven itself.\n\nFor load testers: after any change of database instance or connection pool layout, run a load test against the real peak profile instead of watching graphs in quiet hours. Check what happens to the whole server fleet when a dependency slows down: if the health check depends on the database, a slow database takes out the entire ELB at once. And test a server’s cold start while the site is down, because that is exactly when you need it most."
  },
