    "ru": "Причиной стали резервации. При деплое каждый инстанс заявляет, сколько ядер и памяти ему нужно, и кластер держит это за ним, даже если он столько не потребляет. Из-за ошибки в конфигурации часть сервисов резервировала намного больше, чем ела. К 11:58 почти всё место в части кластера под Listing и Search было зарезервировано при малой реальной загрузке ([CPU](chart:cluster)), а в других частях кластера CPU и память простаивали. Трафик на пике вырос до 200–300 % от вчерашнего ([трафик](chart:traffic)), потоки Undertow упёрлись в потолок ([потоки](chart:threads)), а новые инстансы не могли стартовать ([инстансы](chart:instances)). Потом начал падать фронтенд Opbox, и в 12:05 кластер стал убивать его инстансы. Позже в разборе нашли и усилители: retries без работающего circuit breaker (его порог был выше, чем нагрузка дошла даже в аварию), неполное покрытие rate limiter’ами, пустую страницу с внутренним retry и ботов, которых было очень много.\n\nНезадолго до 12:15 в кластер добавили ресурсы и погасили некритичные сервисы, около 12:20 Allegro снова отвечал. Главное действие по итогам — поменять подход кластера к резервациям, чтобы неиспользуемые ресурсы не выпадали из пула. Плюс настройка пулов потоков и соединений, retry-политик, circuit breaker’ов и быстрый старт Opbox под нагрузкой.\n\nДля нагрузочника: тест одного сервиса на выделенном стенде такое не ловит. Проверяйте сам scale out: дайте рост трафика и смотрите, сколько инстансов реально поднялось, а не сколько запрошено. Сравнивайте reserved и used по кластеру: большой разрыв — это мёртвая ёмкость. И когда latency вдруг падает в разгар аварии, сначала смотрите на throughput: возможно, до сервиса просто перестали доходить запросы ([время ответа](chart:p99)).",
    "en": "The cause was reservations. On deploy every instance declares how many cores and how much memory it needs, and the cluster holds that for it even if it never uses it. Because of a misconfiguration some services reserved far more than they consumed. By 11:58 almost all room in the part of the cluster provisioned for Listing and Search was reserved while real usage was low ([CPU](chart:cluster)), and in other parts of the cluster CPU and memory sat idle. At the peak traffic grew to 200–300% of yesterday ([traffic](chart:traffic)), Undertow threads hit their ceiling ([threads](chart:threads)), and new instances could not start ([instances](chart:instances)). Then the Opbox frontend began to fail, and at 12:05 the cluster started killing its instances. The postmortem also found amplifiers: retries with no working circuit breaker (its threshold was higher than even this outage reached), incomplete rate limiter coverage, a blank page with a built-in retry, and lots of bots.\n\nShortly before 12:15 the team added resources to the cluster and shut down non-critical services; around 12:20 Allegro was responding again. The main follow-up is changing how the cluster reserves resources, so unused ones do not drop out of the pool. Plus tuning thread and connection pools, retry policies, circuit breakers, and making Opbox start fast under load.\n\nFor load testers: testing one service on a dedicated rig will not catch this. Test scale-out itself: ramp the traffic and watch how many instances actually came up, not how many were requested. Compare reserved and used across the cluster: a large gap is dead capacity. And when latency suddenly drops in the middle of an outage, check throughput first: requests may simply have stopped reaching the service ([response time](chart:p99))."
  },
