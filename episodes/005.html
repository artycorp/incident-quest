  "outro": {
    "ru": "Началось всё с утечки соединений. Внутренний endpoint с высоким трафиком не закрывал соединение к Redis, если запрос заканчивался ошибкой. Пока ошибок было мало, утечка не бросалась в глаза: метрики успешного пути были зелёными, а учёта соединений на пути ошибки не было. Один клиент прислал необычно большой всплеск запросов, ошибок стало много, и число подключённых клиентов поползло вверх ([клиенты](chart:clients), [по группам](chart:by_client), [ошибки и рост](chart:leak)).\n\nДальше сработал общий пул. Очереди, блокировки и метаданные лежали на одних серверах Redis, поэтому когда лимит соединений кончился, отказы получили все: воркеры не могли взять задачу, API-ноды не могли открыть соединение ([отказы](chart:errors), [очередь](chart:queue)). Трафик-шейпер увёл всплеск в резервную очередь и смягчил удар, но утечку не остановил. Лимит подняли, к 21:24 стало стабильно, а в 23:06 выкатили hotpatch (соединение закрывается и на пути ошибки) и перезапустили процессы, чтобы слить утёкшие. На следующий день нашлась вторая утечка, которую первый фикс не закрыл. Её поймали раньше и справились меньше чем за час.\n\nДля нагрузочника: гоняйте тест не только на успешных запросах, но и с долей ошибок и таймаутов, потому что утечка на пути ошибки видна только там. Следите за жизненным циклом соединений (`connected_clients` против `maxclients`, открыто минус закрыто) и поднимайте алерт заранее, а не на первых отказах. И проверьте радиус поражения: что будет с остальными ролями, если один потребитель займёт все слоты. Раздельные пулы Redis и бюджет соединений на endpoint ограничивают ущерб.",
    "en": "It started with a connection leak. A high-traffic internal endpoint did not close its Redis connection when a request ended in an error. While errors were rare, the leak stayed out of sight: the success-path metrics were green, and nothing counted connections on the error path. One customer sent an unusually large burst of requests, errors multiplied, and the number of connected clients crept up ([clients](chart:clients), [by group](chart:by_client), [errors and growth](chart:leak)).\n\nThen the shared pool amplified it. Queues, locks and metadata lived on the same Redis servers, so when the connection limit ran out everyone got refusals: workers could not take a job, API nodes could not open a connection ([refusals](chart:errors), [queue](chart:queue)). The traffic shaper moved the burst into a backup queue and softened the blow, but did not stop the leak. The limit was raised, things were stable by 21:24, and at 23:06 a hotpatch went out (the connection is closed on the error path too) and the processes were restarted to drain the leaked ones. The next day a second leak turned up that the first fix had not covered. It was caught earlier and handled in under an hour.\n\nFor load testers: run the test not only on successful requests but with a share of errors and timeouts, because a leak on the error path shows up only there. Watch the connection lifecycle (`connected_clients` against `maxclients`, opened minus closed) and alert early, not on the first refusals. And check the blast radius: what happens to the other roles if one consumer takes every slot. Separate Redis pools and a per-endpoint connection budget limit the damage."
  },
