  "outro": {
    "ru": "Всё из-за одного поста. В нём было около 20 000 пробелов подряд, и регулярка для обрезки пробелов `^[\\s\\u200c]+|[\\s\\u200c]+$` делала на нём около 199 990 000 проверок. Это не экспоненциальный catastrophic backtracking, а O(n²) от длины строки, но этого хватило ([график](chart:checks)). Пост стоял в списке главной, так что дорогая работа запускалась на каждом её просмотре. Главная перестала отвечать вовремя, а именно по ней балансировщик делал health check. Он вывел из ротации все web-серверы, и лёг весь сайт, хотя остальные страницы, по оценке команды, работали бы.\n\nРегулярку заменили функцией substring. Простой длился 34 минуты: 10 на поиск причины, 14 на фикс, 10 на выкатку ([весь инцидент](chart:down)). По итогам команда проверяет свои регулярки и валидацию постов, добавляет в балансировщик возможность отключить health check и пишет чек-лист на время аварии.\n\nДля нагрузочника: тест на «обычных» данных такое не ловит, потому что цена запроса зависит от содержимого, а не от RPS. Кладите в тестовые данные патологические входы: длинные строки, тысячи пробелов подряд, огромные посты, и смотрите CPU на запрос. И проверьте, что проверяет health check: если это тяжёлая страница, её деградация выключит весь сайт.",
    "en": "It all came down to one post. It had about 20,000 consecutive spaces, and the whitespace-trimming regex `^[\\s\\u200c]+|[\\s\\u200c]+$` spent about 199,990,000 checks on it. That is not exponential catastrophic backtracking, just O(n²) in the string length, but it was enough ([chart](chart:checks)). The post sat in the home page list, so the expensive work ran on every home page view. The home page stopped responding fast enough, and the home page was exactly what the load balancer used as its health check. It pulled every web server out of rotation and took down the whole site, even though, by the team’s estimate, every other page would have worked.\n\nThe regex was replaced with a substring function. The outage lasted 34 minutes: 10 to find the cause, 14 to write the fix, 10 to roll it out ([the whole incident](chart:down)). As follow-ups the team audits its regexes and post validation, adds a way to disable the load balancer health check, and writes an outage checklist.\n\nFor load testers: a test on “normal” data will never catch this, because the cost of a request depends on its content, not on RPS. Put pathological inputs into your test data: long strings, thousands of consecutive spaces, huge posts, and watch CPU per request. And check what your health check actually checks: if it is a heavy page, its degradation switches off the whole site."
