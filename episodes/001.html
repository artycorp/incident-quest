    "ru": "25 ноября 2020 года, AWS, регион us-east-1. На Kinesis Data Streams опираются другие сервисы AWS: Cognito, CloudWatch, EventBridge.\n\nЗапросы принимает front-end fleet из многих тысяч серверов. Он проверяет доступ, применяет throttling и направляет запросы в нужные шарды на back-end кластерах. Для маршрутизации каждый front-end сервер держит кеш shard-map ([схема сервиса](001.arch.ru.html)).\n\n05:15 PST. Срабатывают первые алармы ([график ошибок](chart:errors@05:15)). Ты дежурный.",

          },

  "outro": {
    "ru": "Каждый front-end сервер держал по потоку ОС на каждый другой сервер fleet. Небольшое добавление мощности увело все серверы за лимит потоков ОС ([потоки](chart:threads)). Кеш shard-map перестал строиться, и fleet не мог маршрутизировать запросы. Без мощности и после медленного рестарта Kinesis восстановился к 22:23.\n\nПо цепочке упали Cognito ([график](chart:cognito)) и CloudWatch, от которого зависят AutoScaling и Lambda. Даже статус на Service Health Dashboard сначала не могли обновить: инструмент для публикации сам использует Cognito.\n\nДля нагрузочника: потоков на сервер пропорционально размеру fleet, а всего в fleet — квадрату. Такой лимит не ловит тест «больше RPS на тот же кластер», его ловит тест «тот же RPS на кластере больше». AWS добавил алармы на потребление потоков, переходит на более крупные серверы (их меньше, значит меньше потоков) и делит front-end на cells, чтобы каждая работала в проверенном диапазоне.\n\n[Весь инцидент на графике ошибок](chart:errors)",
    "en": "Every front-end server kept one OS thread for every other server in the fleet. A small capacity addition pushed every server past the OS thread limit ([threads](chart:threads)). The shard-map cache stopped building and the fleet could not route requests. With the capacity removed and a slow restart, Kinesis recovered at 10:23 PM.\n\nCognito ([chart](chart:cognito)) and CloudWatch, which AutoScaling and Lambda depend on, went down with it. At first AWS could not even update the Service Health Dashboard: the posting tool itself uses Cognito.\n\nFor load testers: threads per server grow with the fleet size, and threads across the fleet grow with its square. A test of “more RPS on the same cluster” never finds that limit; a test of “the same RPS on a bigger cluster” does. AWS added alarms on thread consumption, is moving to larger servers (fewer of them, so fewer threads) and is splitting the front-end into cells, each running in a tested range.\n\n[The whole incident on the error chart](chart:errors)"
  },
